# This file is the fallback config when Netlify's base directory is set to
# "frontend" directly in the site UI (instead of relying on the root netlify.toml).
# Both files must stay in sync.

[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS    = "--legacy-peer-deps"

# SPA Fallback — serve index.html for every path so React Router handles routing
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-lived cache for hashed static assets (JS/CSS/images)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No cache for the HTML entry point so new deploys are always fresh
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
